openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    enum:
                      - up
                      - down
                    example: up
      summary: Health check system and database
      tags:
        - Health
  /api/v1/auth/register:
    post:
      operationId: IdentityController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      summary: Đăng ký tài khoản người dùng
      tags:
        - Auth & Identity
  /api/v1/auth/login:
