        - payments
    ReturnBookingDto:
      type: object
      properties:
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/HandoverChecklistItemDto'
        conditionNotes:
          type: object
          nullable: true
        photoPaths:
          type: array
          items:
            type: string
      required:
        - checklist
        - photoPaths
    CompleteChargeItemDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - DAMAGE_CHARGE
            - LATE_FEE
        amount:
          type: number
          example: 200000
        note:
          type: object
          nullable: true
      required:
        - type
        - amount
    CompleteBookingDto:
      type: object
      properties:
        charges:
          default: []
          type: array
          items:
            $ref: '#/components/schemas/CompleteChargeItemDto'
        refundMethod:
          type: string
          enum:
            - CASH
            - BANK_TRANSFER
        note:
          type: object
          nullable: true
      required:
        - refundMethod
    UpdateAdminUserDto:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
              - RENTER
              - STAFF
              - ADMIN
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
