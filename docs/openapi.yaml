info:
  title: Borroll API
  description: Borroll Camera Rental Store Backend API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          example: a@example.com
        phone:
          type: string
          example: '0912345678'
        password:
          type: string
          example: matkhau123
          minLength: 8
      required:
        - fullName
        - email
        - phone
        - password
    AuthUserEntity:
      type: object
      properties:
        id:
          type: string
          example: clx...
        fullName:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          example: a@example.com
        roles:
          example:
            - RENTER
          type: array
          items:
            type: string
      required:
        - id
        - fullName
        - email
        - roles
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        user:
          $ref: '#/components/schemas/AuthUserEntity'
      required:
        - accessToken
        - user
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: a@example.com
        password:
          type: string
          example: matkhau123
      required:
        - email
        - password
    MeResponse:
      type: object
      properties:
        id:
          type: string
          example: clx...
        fullName:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          example: a@example.com
        phone:
          type: object
          example: '0912345678'
          nullable: true
        avatarUrl:
          type: object
          example: null
          nullable: true
        roles:
          example:
            - RENTER
          type: array
          items:
            type: string
      required:
        - id
        - fullName
        - email
        - phone
        - avatarUrl
        - roles
    UpdateProfileDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyễn Văn B
        phone:
          type: string
          example: '0987654321'
        avatarPath:
          type: object
          example: avatars/clx123/abc.jpg
          nullable: true
          description: >-
            Đường dẫn ảnh đại diện nhận từ /me/avatar/presign, hoặc null để xóa
            ảnh
    AvatarPresignDto:
      type: object
      properties:
        contentType:
          type: string
          example: image/jpeg
          enum:
            - image/jpeg
            - image/png
            - image/webp
      required:
        - contentType
    AvatarPresignResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          example: https://...
        path:
          type: string
          example: avatars/u1/abc.jpg
        token:
          type: string
          example: eyJhbGciOi...
      required:
        - uploadUrl
        - path
        - token
    CreateUnitBlockDto:
      type: object
      properties:
        unitId:
          type: string
        startDate:
          type: string
          example: '2026-12-10'
        endDate:
          type: string
          example: '2026-12-12'
        reason:
          type: string
          example: Thay pin, vệ sinh
      required:
        - unitId
        - startDate
        - endDate
        - reason
    CreateUnitDto:
      type: object
      properties:
        modelId:
          type: string
        branchId:
          type: string
        serialNumber:
          type: string
          example: OXA-0042
        condition:
          type: string
          enum:
            - EXCELLENT
            - GOOD
            - FAIR
          default: EXCELLENT
        status:
          type: string
          enum:
            - AVAILABLE
            - MAINTENANCE
            - RETIRED
          default: AVAILABLE
        notes:
          type: object
        purchasedAt:
          type: object
      required:
        - modelId
        - branchId
        - serialNumber
    UpdateUnitDto:
      type: object
      properties:
        modelId:
          type: string
        branchId:
          type: string
        serialNumber:
          type: string
        condition:
          type: string
          enum:
            - EXCELLENT
            - GOOD
            - FAIR
        status:
          type: string
          enum:
            - AVAILABLE
